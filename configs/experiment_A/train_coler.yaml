# Setting 2: Train on COLER, Validate on COLER, Test on COLER
experiment:
  name: "exp_a_train_coler"
  description: "Experiment A Setting 2: Train COLER -> Val COLER -> Test COLER"
  output_dir: "outputs/exp_a_train_coler"
  seed: 42

dataset:
  manifest_path: "data/manifests/unified_frame_dataset.csv"
  target_dataset: "COLER"
  eval_target_dataset: "COLER"
  label_type: "primary" # 3-class (Low, Mid, High)
  fold: 0
  balance_classes: true
  batch_size: 32
  num_workers: 0
  pin_memory: true

model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 3
  dropout_rate: 0.5
  freeze_backbone: false
  unfreeze_blocks: []
  gradual_unfreeze: false

training:
  epochs: 20
  use_amp: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  auto_resume: true
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
    monitor: "val_macro_f1"
    mode: "max"

optimizer:
  type: "adamw"
  lr: 0.0001
  weight_decay: 0.01
  momentum: 0.9

scheduler:
  type: "cosine"
  t_max: 20
  eta_min: 0.000001

evaluation:
  eval_batch_size: 32
