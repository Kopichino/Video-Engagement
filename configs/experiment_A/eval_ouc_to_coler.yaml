# Setting 3: Train on OUC-CGE -> Evaluate directly on COLER (No fine-tuning)
experiment:
  name: "exp_a_eval_ouc_to_coler"
  description: "Experiment A Setting 3: Direct Transfer - Trained OUC Model evaluated on COLER Test Set"
  output_dir: "outputs/exp_a_eval_ouc_to_coler"
  checkpoint_to_load: "outputs/exp_a_train_ouc/checkpoints/best_model.pth"
  seed: 42

dataset:
  manifest_path: "data/manifests/unified_frame_dataset.csv"
  target_dataset: "COLER" # Evaluate on COLER
  label_type: "primary"
  fold: 0
  batch_size: 32
  num_workers: 0
  pin_memory: true

model:
  architecture: "resnet50"
  num_classes: 3
  dropout_rate: 0.5

evaluation:
  eval_batch_size: 32
