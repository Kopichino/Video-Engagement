# Experiment DG: Single-Source Domain Generalization
# Train 3D R(2+1)D-18 on OUC-CGE with MixStyle + Domain Randomization Augmentations + Label Smoothing
experiment:
  name: "exp_dg_train_ouc_mixstyle"
  description: "Single-Source Domain Generalization: 3D R(2+1)D-18 with MixStyle & Domain Randomization on OUC-CGE"
  output_dir: "outputs/exp_dg_train_ouc_mixstyle"
  seed: 42

dataset:
  manifest_path: "data/manifests/unified_manifest.csv"
  target_dataset: "OUC-CGE"
  eval_target_dataset: "OUC-CGE"
  label_type: "primary"
  is_video_3d: true
  num_frames: 16
  img_size: 224
  fold: 0
  balance_classes: true
  augment: true
  batch_size: 4
  num_workers: 0
  pin_memory: false
  use_ram_cache: false

model:
  architecture: "r2plus1d_18"
  pretrained: true
  num_classes: 3
  dropout_rate: 0.5
  use_mixstyle: true
  mixstyle_p: 0.5
  mixstyle_alpha: 0.3
  freeze_backbone: false

training:
  epochs: 20
  use_amp: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  label_smoothing: 0.1
  auto_resume: true
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
    monitor: "val_macro_f1"
    mode: "max"

optimizer:
  type: "adamw"
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  type: "cosine"
  t_max: 20
  eta_min: 0.000001

evaluation:
  eval_batch_size: 4
