# Experiment B Setting 1: Train 3D Model on OUC-CGE, Validate on OUC-CGE, Test on OUC-CGE
experiment:
  name: "exp_b_train_ouc_3d"
  description: "Experiment B Setting 1: 3D R(2+1)D-18 Model on OUC-CGE (5-Fold CV)"
  output_dir: "outputs/exp_b_train_ouc_3d"
  seed: 42

dataset:
  manifest_path: "data/manifests/unified_manifest.csv"
  target_dataset: "OUC-CGE"
  eval_target_dataset: "OUC-CGE"
  label_type: "primary" # 3-class (Low, Mid, High)
  is_video_3d: true
  num_frames: 16
  img_size: 224
  fold: 0
  balance_classes: true
  batch_size: 8
  num_workers: 0
  pin_memory: false

model:
  architecture: "r2plus1d_18"
  pretrained: true
  num_classes: 3
  dropout_rate: 0.5
  freeze_backbone: false

training:
  epochs: 20
  use_amp: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  auto_resume: true
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
    monitor: "val_macro_f1"
    mode: "max"

optimizer:
  type: "adamw"
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  type: "cosine"
  t_max: 20
  eta_min: 0.000001

evaluation:
  eval_batch_size: 8
